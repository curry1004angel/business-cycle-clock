name: Update macro data

on:
  schedule:
    # 발표 일정이 지표군마다 달라 월 3회 수집한다.
    - cron: "0 12 3 * *"    # 3일:  ISM PMI(1영업일), 고용보고서(첫 금요일)
    - cron: "0 12 6 * *"    # 6일:  위 발표가 늦는 달 대비 재시도
    - cron: "0 12 18 * *"   # 18일: 산업생산·설비가동률·소매판매(중순 발표)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch latest ISM PMI (best-effort)
        run: python scripts/update_pmi.py

      - run: python scripts/update_data.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/series.parquet data/meta.json data/pmi_manual.csv
          git commit -m "chore: update macro data $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
